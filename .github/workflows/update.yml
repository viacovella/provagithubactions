name: Aggiorna Dashboard Automatica

on:
  schedule:
    - cron: '*/15 * * * *'  # Esegue lo script ogni 15 minuti
  workflow_dispatch:         # Permette di avviarlo anche manualmente da GitHub

# AUTORIZZAZIONE DI SCRITTURA PER IL BOT DI GITHUB ACTIONS
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice del repo
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installa le librerie necessarie
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas plotly

      - name: Esegui lo script app.py
        run: python app.py

      - name: Salva i dati aggiornati su GitHub
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add data/history.csv index.html
          git commit -m "Aggiornamento automatico dati [skip ci]" || exit 0
          git push
